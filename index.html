<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>艸引子聯合建築師事務所｜建築作品集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#ebe8e1;--ink:#1c2530;--muted:#5b6673;--accent:#0e344c;--card:rgba(250,249,246,.85);--line:rgba(14,52,76,.16)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper)}
  body{color:var(--ink);font-family:"jf-jinxuan-3.0","jf-jinxuan-3.0 Book","Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:14px;padding:22px 7vw;font-size:13px;letter-spacing:.18em;font-weight:500}
  header .logo{height:34px;width:auto;display:block}
  header .sep{width:1px;height:18px;background:var(--line)}
  .identity{display:block;height:150px;width:auto;max-width:100%;margin:0 0 36px -10px}
  main{flex:1;padding:6vh 7vw 10vh;max-width:1100px}
  .eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.34em;color:var(--accent);font-weight:500;margin-bottom:22px}
  .eyebrow::before{content:"";width:32px;height:1px;background:currentColor}
  h1{font-family:"jf-jinxuan-3.0 SemiBold","jf-jinxuan-3.0","Noto Serif TC",serif;font-weight:600;font-size:clamp(32px,4.6vw,60px);line-height:1.25;letter-spacing:.03em;margin-bottom:14px}
  .sub{font-size:clamp(14px,1.1vw,17px);line-height:1.9;color:var(--muted);max-width:34em;margin-bottom:48px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  .item{display:block;color:inherit;text-decoration:none;padding:28px 28px 24px;background:var(--card);border:1px solid rgba(255,255,255,.65);border-radius:2px;box-shadow:0 30px 60px -40px rgba(50,35,20,.35);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
  .item:hover{transform:translateY(-4px);box-shadow:0 40px 70px -40px rgba(50,35,20,.5)}
  .item .no{font-family:"jf-jinxuan-3.0 SemiBold","jf-jinxuan-3.0","Noto Serif TC",serif;color:var(--accent);font-size:30px;line-height:1}
  .item h2{font-family:"jf-jinxuan-3.0 SemiBold","jf-jinxuan-3.0","Noto Serif TC",serif;font-weight:600;font-size:21px;line-height:1.4;margin:14px 0 8px;letter-spacing:.02em}
  .item p{font-size:14px;line-height:1.8;color:var(--muted);min-height:2.5em}
  .item .go{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:12px;letter-spacing:.2em;color:var(--ink)}
  .item .go::after{content:"";width:28px;height:1px;background:var(--ink);transition:width .3s}
  .item:hover .go::after{width:44px}
  footer{padding:20px 7vw;font-size:12px;letter-spacing:.1em;color:var(--muted)}
  @media (max-width:760px){header{padding:16px 20px}header .logo{height:26px}header .sep,header .name{display:none}main{padding:4vh 20px 8vh}.identity{height:110px;margin:0 0 24px -6px}.item{padding:22px 20px 20px}.sub{margin-bottom:28px}}
</style>
</head>
