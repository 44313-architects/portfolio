<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ArkiTeki 建築作品集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#ebe7df;--ink:#1f1d1a;--muted:#5f5a52;--accent:#b0502a;--card:rgba(250,248,244,.85);--line:rgba(31,29,26,.14)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper)}
  body{color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:22px 7vw;font-size:13px;letter-spacing:.18em;font-weight:500}
  .mark{width:16px;height:16px;border:1.5px solid var(--ink);background:linear-gradient(var(--ink),var(--ink)) center/1.5px 100% no-repeat,linear-gradient(var(--ink),var(--ink)) center/100% 1.5px no-repeat}
  main{flex:1;padding:6vh 7vw 10vh;max-width:1100px}
  .eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.34em;color:var(--accent);font-weight:500;margin-bottom:22px}
  .eyebrow::before{content:"";width:32px;height:1px;background:currentColor}
  h1{font-family:"Noto Serif TC",serif;font-weight:600;font-size:clamp(32px,4.6vw,60px);line-height:1.25;letter-spacing:.03em;margin-bottom:14px}
  .sub{font-size:clamp(14px,1.1vw,17px);line-height:1.9;color:var(--muted);max-width:34em;margin-bottom:48px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  .item{display:block;color:inherit;text-decoration:none;padding:28px 28px 24px;background:var(--card);border:1px solid rgba(255,255,255,.65);border-radius:2px;box-shadow:0 30px 60px -40px rgba(50,35,20,.35);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
  .item:hover{transform:translateY(-4px);box-shadow:0 40px 70px -40px rgba(50,35,20,.5)}
  .item .no{font-family:"Noto Serif TC",serif;color:var(--accent);font-size:30px;line-height:1}
  .item h2{font-family:"Noto Serif TC",serif;font-weight:600;font-size:21px;line-height:1.4;margin:14px 0 8px;letter-spacing:.02em}
  .item p{font-size:14px;line-height:1.8;color:var(--muted);min-height:2.5em}
  .item .go{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:12px;letter-spacing:.2em;color:var(--ink)}
  .item .go::after{content:"";width:28px;height:1px;background:var(--ink);transition:width .3s}
  .item:hover .go::after{width:44px}
  footer{padding:20px 7vw;font-size:12px;letter-spacing:.1em;color:var(--muted)}
  @media (max-width:760px){header{padding:16px 20px}main{padding:4vh 20px 8vh}.item{padding:22px 20px 20px}.sub{margin-bottom:28px}}
</style>
</head>
<body>
<header><span class="mark"></span><span>ARKITEKI</span></header>
<main>
  <div class="eyebrow">PORTFOLIO</div>
  <h1>建築作品集</h1>
  <p class="sub">每一件作品都是可以用手指或滾輪慢慢看的 3D 導覽。點選案子後往下捲動，鏡頭會帶你走過設計裡被仔細安排的細節。</p>
  <div class="grid" id="grid"></div>
</main>
<footer>© ArkiTeki</footer>
<script>
// 新增案子：在這裡加一行，folder 要和 repo 裡的資料夾名稱一致（該資料夾放匯出的 index.html）
const PROJECTS = [
  { folder: 'nantou-1230', title: '南投名間 住宅', desc: '從磁磚、管線到每一道開口，細節從設計之初就被安排好。' },
];
const grid = document.getElementById('grid');
PROJECTS.forEach((p, i) => {
  const a = document.createElement('a');
  a.className = 'item';
  a.href = p.folder + '/';
  const no = document.createElement('div'); no.className = 'no'; no.textContent = String(i + 1).padStart(2, '0');
  const h2 = document.createElement('h2'); h2.textContent = p.title;
  const d = document.createElement('p'); d.textContent = p.desc || '';
  const go = document.createElement('span'); go.className = 'go'; go.textContent = '進入導覽';
  a.append(no, h2, d, go);
  grid.appendChild(a);
});
</script>
</body>
</html>
